# Publishes the site to Vercel (project "estetic-derm") on every push to main.
# Requires the repository secret VERCEL_TOKEN (Settings → Secrets and variables → Actions).
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_7ZNQnUho4bv2hrvZP2TIbtbO
      VERCEL_PROJECT_ID: prj_gyk7VbEcFkezl7SNHAES93K4kkDY
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Secret VERCEL_TOKEN is not set — skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Deploy to Vercel (production)
        if: steps.token.outputs.ok == 'true'
        run: npx --yes vercel@52.0.0 deploy --prod --yes --token "$VERCEL_TOKEN"
